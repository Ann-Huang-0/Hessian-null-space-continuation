[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hnc"
version = "0.1.0"
description = "Hessian Null Space Continuation: traversing the solution space of neural networks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy", "scipy", "pyyaml", "pot"]

[project.optional-dependencies]
notebook = ["matplotlib", "scikit-learn", "jupyter"]

[tool.setuptools.packages.find]
include = ["hnc*"]
