# DSA-steered walk of Fig. 2 (Appendix, "Settings of the DSA-steered walks").
task: flipflop
anchor: 0
seed: 0
preserve: function
curvature: gauss_newton
data: {trials: 128, time: 50}
dtype: float64

direction:
  type: steer
  objective: dsa        # maximize the DSA distance of the hidden-state dynamics from the anchor's
  n_delays: 5
  rank: 10
  probe_trials: 32
  mu_rel: 1.0e-7
  cg_iters: 200
  cg_warm_start: false

walk:
  n_steps: 2000
  tau: 1.0e-2
  restore_steps: 12
  eta: 0.03
  eta_min: 5.0e-4
  save: 25
  metrics_every: 10
