# Undirected walk along the flattest direction (the undirected networks of Fig. 2C-E).
# Identical to undirected.yaml except for the direction rule.
task: flipflop
anchor: 0
seed: 0
preserve: function
curvature: hessian
data: {trials: 256, time: 100}
dtype: float32

direction:
  type: flattest        # the flattest direction of the null space, recomputed at each relinearization
  mu_rel: 1.0e-3
  method: dense
  exclude_rotations: true

walk:
  n_steps: 600
  tau: 1.0e-2
  restore_steps: 12
  eta: 1.0
  eta_min: 1.0e-4
  eta_max: 4.0
  grow: 1.1
  relinearize_every: 20
  save: 25
  metrics_every: 10
