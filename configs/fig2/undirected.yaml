# Undirected walk of Fig. 2 (Appendix, "Settings of the undirected walks").
task: flipflop
anchor: 0               # trained network data/anchors/flipflop/seed_<anchor>.pt (anchors are 0-4)
seed: 0                 # seed of the random heading (replicates use 0, 1, 2)
preserve: function      # task: task MSE | function: MSE to the anchor's outputs (Eq. 1)
curvature: hessian      # flat directions of the full Hessian of the preserved loss
data: {trials: 256, time: 100}
dtype: float32

direction:
  type: random          # one random heading, projected onto the null space
  mu_rel: 1.0e-3        # flat: |lambda| <= mu_rel * max |lambda|
  method: dense         # eigendecompose the 4,611 x 4,611 Hessian
  exclude_rotations: true   # leave out the directions that only rotate the hidden units

walk:
  n_steps: 600
  tau: 1.0e-2           # loss ceiling
  restore_steps: 12
  eta: 1.0              # null-space step size: halved on rejection, x1.1 after each accepted step
  eta_min: 1.0e-4
  eta_max: 4.0
  grow: 1.1
  relinearize_every: 20
  save: 25
  metrics_every: 10
